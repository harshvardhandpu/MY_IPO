title = "Sanket IPO secret scanning"

[[rules]]
id = "indian-pan"
description = "Plaintext Indian PAN-like identifier"
regex = '''\b[A-Z]{5}[0-9]{4}[A-Z]\b'''
keywords = ["pan", "account", "identity"]

[allowlist]
description = "Synthetic scanners construct sensitive-looking values at runtime; masked PAN is safe"
paths = [
  '''Cargo\.lock''',
  '''package-lock\.json'''
]
