[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/allotment",
  "crates/audit",
  "crates/domain",
  "crates/device-settings",
  "crates/intelligence-vault",
  "crates/identity-security",
  "crates/local-index",
  "crates/member-vault",
  "crates/ranking",
  "crates/sync-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
keyring = { version = "3.6", features = [
  "apple-native",
  "crypto-rust",
  "linux-native-sync-persistent",
  "windows-native",
] }
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
