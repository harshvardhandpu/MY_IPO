[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/audit",
  "crates/domain",
  "crates/device-settings",
  "crates/intelligence-vault",
  "crates/local-index",
  "crates/member-vault",
  "crates/sync-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
