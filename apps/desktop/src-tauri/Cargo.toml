[package]
name = "sanket-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sanket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sanket-ipo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
sanket-device-settings = { path = "../../../crates/device-settings" }
sanket-domain = { path = "../../../crates/domain" }
sanket-identity-security = { path = "../../../crates/identity-security" }
sanket-intelligence-vault = { path = "../../../crates/intelligence-vault" }
sanket-local-index = { path = "../../../crates/local-index" }
sanket-member-vault = { path = "../../../crates/member-vault" }
sanket-ranking = { path = "../../../crates/ranking" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.11.5", features = [] }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.24"
